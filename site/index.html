<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101112">
  <meta name="description" content="signull quietly sorts x and youtube around what you care about.">
  <title>signull</title>
  <link rel="preload" href="/assets/signal-poster.webp" as="image" type="image/webp">
  <style>
    :root {
      color-scheme: dark;
      --paper: #101112;
      --ink: #ddd9d0;
      --muted: #817f7a;
      --line: rgba(221, 217, 208, .16);
    }

    * { box-sizing: border-box; }

    html,
    body { min-height: 100%; margin: 0; }

    body {
      color: var(--ink);
      background:
        radial-gradient(circle at 27% 44%, rgba(91, 81, 69, .16), transparent 31%),
        radial-gradient(circle at 72% 62%, rgba(76, 80, 84, .11), transparent 34%),
        var(--paper);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      opacity: .18;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E");
    }

    .landing {
      position: relative;
      display: grid;
      min-height: 100svh;
      isolation: isolate;
    }

    .hero {
      align-self: center;
      display: grid;
      grid-template-columns: 320px minmax(280px, 350px);
      align-items: center;
      gap: clamp(34px, 6vw, 76px);
      width: fit-content;
      max-width: calc(100vw - 64px);
      margin: 0 auto;
      padding: 64px 0;
    }

    .poster {
      display: block;
      width: 320px;
      height: 430px;
      object-fit: cover;
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 22px 70px rgba(0, 0, 0, .36);
    }

    .copy { max-width: 350px; }

    .wordmark {
      margin: 0 0 22px;
      color: #f0eee8;
      font-size: 42px;
      font-weight: 670;
      line-height: 1;
      letter-spacing: -.065em;
    }

    .copy p {
      margin: 0;
      color: #aaa69e;
      font-size: 18px;
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: -.012em;
    }

    .download {
      display: inline-flex;
      align-items: baseline;
      gap: 8px;
      margin-top: 16px;
      color: #e5e2da;
      font-size: 18px;
      font-weight: 460;
      line-height: 1;
      text-decoration: underline;
      text-decoration-color: #77746e;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 160ms ease, transform 160ms ease, text-decoration-color 160ms ease;
    }

    .download:hover,
    .download:focus-visible {
      color: #fff;
      text-decoration-color: currentColor;
      transform: translateX(3px);
    }

    .download:focus-visible { outline: 1px solid #8d8981; outline-offset: 6px; }

    .download-note {
      display: block;
      margin-top: 9px;
      color: var(--muted);
      font: 500 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .meta {
      display: block;
      margin-top: 25px;
      color: var(--muted);
      font: 550 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .key-link {
      display: inline-block;
      margin-top: 11px;
      color: #aaa69e;
      font-size: 13px;
      text-decoration: underline;
      text-decoration-color: #77746e;
      text-underline-offset: 3px;
    }

    .key-link:hover { color: #e5e2da; }
    .key-link:focus-visible { outline: 1px solid #8d8981; outline-offset: 4px; }

    @media (max-width: 760px) {
      .hero {
        grid-template-columns: minmax(240px, 320px);
        justify-items: center;
        gap: 28px;
        max-width: min(440px, calc(100vw - 38px));
        padding: 38px 0 56px;
      }

      .poster { width: min(320px, 82vw); height: auto; aspect-ratio: 3 / 4; }
      .copy { width: min(350px, 86vw); }
      .wordmark { font-size: 38px; }
      .copy p, .download { font-size: 17px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .download { transition: none; }
    }
  </style>
</head>
<body>
  <main class="landing">
    <section class="hero" aria-labelledby="signull-title">
      <img
        class="poster"
        src="/assets/signal-poster.webp"
        alt="an abstract signal passing cleanly through layered material"
        width="1024"
        height="1536"
        fetchpriority="high"
      >

      <div class="copy">
        <h1 class="wordmark" id="signull-title">signull</h1>
        <p>tell it what you care about. signull reads the posts and videos already in front of you, then quietly separates signal from noise.</p>
        <a class="download" href="/signull-extension.zip" download>
          add to chrome <span aria-hidden="true">→</span>
        </a>
        <span class="download-note">downloads a zip to load as an unpacked extension</span>
        <span class="meta">x + youtube · bring your own key · v0.3.3</span>
        <a class="key-link" href="https://vercel.com/d?title=AI+Gateway+API+Keys&amp;to=%2F%5Bteam%5D%2F~%2Fai-gateway%2Fapi-keys" target="_blank" rel="noopener noreferrer">get a vercel key ↗</a>
      </div>
    </section>
  </main>
</body>
</html>
